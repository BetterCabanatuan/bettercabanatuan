# City Government Departments
# Source of truth for department listings on /government/departments
#
# Office names, locations and numbers follow the City Government of Cabanatuan
# Citizen's Charter 2022 (2nd Edition), "VII. List of Offices", pp. 342-345.
# Slugs are URL identifiers and stay fixed even when a display name changes.


# Department Pages
# Legacy content pages linked from /government/departments/{slug}
#
# Every slug in src/data/departments.yaml has a page here. Office names follow
# the Citizen's Charter 2022 (2nd Edition), "VII. List of Offices", pp. 342-345.

pages:
  - name: 'Office of the City Mayor'
    slug: 'executive'
    description: "Find out about your Mayor and Vice Mayor, including upcoming events, the Mayor's Community Assistance Program, mayoral history, and information about other historic roles in the local government unit."
  - name: 'Sangguniang Panlungsod'
    slug: 'legislative'
    description: 'As of the 2025–2028 term, the Sangguniang Panlungsod (City Council) of Cabanatuan City has 12 elected councilors, with the Vice Mayor as the presiding officer of the council.'
  - name: 'City General Services Office'
    slug: 'gso'
    description: 'Purchase requests, office supplies, logistics and manpower assistance for city offices, and the General Clearance.'
  - name: 'City Human Resource Management Office'
    slug: 'chrmo'
    description: 'Service records, certificates of employment and leave credits, loan certifications and leave applications for city employees, and on-the-job training.'
  - name: 'City Information and Tourism Office'
    slug: 'tourism'
    description: 'Requests for city data, sound system and photo or video coverage, LED wall, and messages of the City Mayor.'
  - name: 'Office for City Legal Affairs'
    slug: 'city-legal-office'
    description: 'Legal assistance for residents referred by the City Mayor, legal complaints, legal forms, and PLEB clearances.'
  - name: 'Community Affairs Office'
    slug: 'community-affairs'
    description: 'The office whose Traffic Management Section handles tricycle (MTOP) requirements; contact details from the Citizen’s Charter.'
  - name: 'Office of the City Accountant'
    slug: 'accounting-office'
    description: 'BIR Forms 2306 and 2307 for workers, suppliers and contractors, and certifications of GSIS, PhilHealth and BIR remittances.'
  - name: 'Office of the City Assessor'
    slug: 'assessors-office'
    description: 'Certified copies of tax declarations, property-holding certifications, transfer of tax declarations, and assessment of new buildings.'
  - name: 'City Budget Office'
    slug: 'budget-office'
    description: 'Technical assistance to barangays and certification of availability of appropriations.'
  - name: 'City Business Licensing and Investment Promotion Office'
    slug: 'bplo'
    description: 'New and renewed business permits, occupational permits, and changes to a business’s location, ownership or status.'
  - name: 'Office of the City Treasurer'
    slug: 'city-treasurers-office'
    description: 'Real property tax, transfer tax and business tax payments, Community Tax Certificates, tax clearances, and large cattle branding.'
  - name: 'City Economic Enterprise and Public Utilities Management Office'
    slug: 'ceepumo'
    description: 'Public market clearances and certificates for vendors, weighing scale calibration, product sampling permits, and illegal vending complaints.'
  - name: 'Cabanatuan City Environment and Natural Resources Office'
    slug: 'cenro'
    description: 'City Environmental Certificate, City Environment Permit to Operate, quarry and tree-cutting clearances, hauling passes, and environmental complaints.'
  - name: 'Office of the City Engineer'
    slug: 'city-engineers-office'
    description: 'Lot surveys and road right-of-way certification, plans for barangay projects, road clearing and drainage de-clogging, and public lighting repair.'
  - name: 'Office of the City Building Official'
    slug: 'city-building-official'
    description: 'Building, occupancy, fence, demolition, excavation and electrical permits.'
  - name: 'City Motor Pool Office'
    slug: 'motor-pool'
    description: 'Service vehicle inspection and lending, heavy equipment for city projects, re-gravelling requests, and free oxygen tank refills.'
  - name: 'City Planning and Development Office'
    slug: 'cpdo'
    description: 'Locational clearances and zoning permits, site zoning certificates, zoning appeals, and development permits for subdivisions and condominiums.'
  - name: 'City Agriculture Office'
    slug: 'city-agriculture-office'
    description: 'Farmer certifications and IDs, planting materials, tilapia fingerlings, soil tests, farm machinery, and DA inputs for farmer-beneficiaries.'
  - name: 'City Civil Registry Office'
    slug: 'lcro'
    description: 'Birth, marriage and death registration, marriage licenses, civil registry certifications, and corrections under RA 9048 and RA 10172.'
  - name: 'City Disaster Risk Reduction and Management Office'
    slug: 'cdrrmo'
    description: '24/7 emergency response, disaster preparedness trainings, medical standby, transportation assistance and disinfection.'
  - name: 'City Health Office'
    slug: 'cho'
    description: 'Free medical and dental consultation, TB and animal bite treatment, immunization, family planning, and health certificates and sanitary permits.'
  - name: 'City Health Centers'
    slug: 'city-health-centers'
    description: 'The six barangay City Health Centers and the City Epidemiology and Surveillance Unit, with their direct lines.'
  - name: 'City Livelihood and Cooperatives Development Office'
    slug: 'clcdo'
    description: 'Free livelihood and skills training, cooperative orientation and seminars, certificates of good standing, and TESDA course certificates.'
  - name: 'MVG Cabanatuan City General Hospital'
    slug: 'mvg-city-general-hospital'
    description: 'Free out-patient consultation by clinic schedule, medical and medico-legal certificates, and hemodialysis at the city-run hospital.'
  - name: 'Public Employment Services Office'
    slug: 'peso'
    description: 'Job seeker registration and matching, and approval of local and special recruitment activities.'
  - name: 'City Social Welfare and Development Office'
    slug: 'cswdo'
    description: 'OSCA and Solo Parent IDs, certificates of indigency, 4Ps certification, solicitation permits, ECCD permits, and basic literacy programs.'
  - name: 'City Veterinary Office'
    slug: 'city-veterinary-office'
    description: 'Free pet and livestock treatment, anti-rabies vaccination, meat inspection, veterinary health certificates, and stray animal impounding.'
  - name: 'Land Registration Authority — Registry of Deeds'
    slug: 'lra-registry-of-deeds'
    description: 'A national agency for land titles and deeds, not a city office; it is not in the Citizen’s Charter.'
